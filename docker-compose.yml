services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: testgen
      POSTGRES_PASSWORD: testgen
      POSTGRES_DB: testgen
    restart: unless-stopped
    ports:
      - "5460:5432"
    volumes:
      - testgen_pgdata:/var/lib/postgresql/data

volumes:
  testgen_pgdata:
